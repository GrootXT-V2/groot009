# Xcode project for the Kurama iPhone app.
# Generate the project with:  brew install xcodegen && cd ios && xcodegen
name: Kurama
options:
  bundleIdPrefix: com.groot009
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Pick your own Team in Xcode (Signing & Capabilities) the first time you build.
    CODE_SIGN_STYLE: Automatic
targets:
  Kurama:
    type: application
    platform: iOS
    sources:
      - path: Kurama
      - path: ../groot/assets/red-white-fox-sleeping.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groot009.kurama
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Kurama
    info:
      path: Kurama/Info.plist
      properties:
        CFBundleDisplayName: Kurama
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Kurama listens when you tap it, so you can talk to it.
        NSSpeechRecognitionUsageDescription: Kurama turns what you say into text to understand you.
        NSLocalNetworkUsageDescription: Kurama talks to Groot running on your Mac over your Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true  # the Mac's Wi-Fi link is plain http
        CFBundleURLTypes:
          - CFBundleURLName: com.groot009.kurama
            CFBundleURLSchemes: [kurama]
    dependencies:
      - target: KuramaWidget
        embed: true
  KuramaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: KuramaWidget
      - path: ../groot/assets/red-white-fox-sleeping.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groot009.kurama.widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: KuramaWidget/Info.plist
      properties:
        CFBundleDisplayName: Kurama
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
