<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groot">
<meta name="theme-color" content="#bfe3f2">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Groot</title>
<style>
  :root {
    --sky-top: #bfe3f2;
    --sky-bottom: #eaf6ef;
    --grass: #cfe5bf;
    --grass-edge: #b6d6a3;
    --ink: #1f2a33;
    --muted: #5d6b76;
    --card: rgba(255, 255, 255, 0.92);
    --accent: #e0702d;
    --accent-dark: #b9541a;
    --listen: #2fb36b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: linear-gradient(var(--sky-top), var(--sky-bottom) 70%);
    user-select: none; -webkit-user-select: none;
  }
  #ground {
    position: fixed; left: 0; right: 0; bottom: 0; height: 30%;
    background: var(--grass); border-top: 3px solid var(--grass-edge);
  }
  #status {
    position: fixed; top: calc(env(safe-area-inset-top) + 14px); left: 50%; transform: translateX(-50%);
    background: var(--card); padding: 6px 14px; border-radius: 999px; font-size: 14px; color: var(--muted);
    box-shadow: 0 1px 6px rgba(0,0,0,0.08); white-space: nowrap;
  }
  #status.listening { color: #fff; background: var(--listen); }
  #bubble {
    position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top) + 58px);
    max-height: 34vh; overflow-y: auto; display: none;
    background: var(--card); border-radius: 18px; padding: 12px 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.10); font-size: 17px;
  }
  #bubble .you { color: var(--muted); font-size: 14px; margin-bottom: 4px; }
  #buddy {
    position: fixed; bottom: calc(30% - 12px); left: 0;
    width: min(78vw, 360px); touch-action: manipulation; cursor: pointer;
  }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
    display: flex; gap: 10px; align-items: center;
  }
  #text {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 12px 16px; border-radius: 999px;
    border: 1px solid rgba(0,0,0,0.12); background: #fff; color: var(--ink); outline: none;
  }
  #text:focus { border-color: var(--accent); }
  button {
    font: inherit; border: 0; border-radius: 999px; height: 48px; min-width: 48px; padding: 0 16px;
    background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
  #mic { width: 56px; height: 56px; background: var(--accent); color: #fff; font-size: 24px; }
  #mic.on { background: var(--listen); }
  #hint { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 84px);
    text-align: center; color: var(--muted); font-size: 13px; }
  #message {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 32px;
    text-align: center; color: var(--ink); background: linear-gradient(var(--sky-top), var(--sky-bottom));
  }
</style>
</head>
<body>
<div id="ground"></div>
<div id="status">Loading…</div>
<div id="bubble"><div class="you" id="you"></div><div id="reply"></div></div>
<canvas id="buddy" aria-label="Groot - tap to talk"></canvas>
<div id="hint"></div>
<form id="bar" autocomplete="off">
  <input id="text" placeholder="Type or dictate…" enterkeyhint="send">
  <button id="mic" type="button" aria-label="Talk">🎤</button>
</form>
<div id="message"></div>
<audio id="player" playsinline></audio>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  let key = params.get("k") || "";
  try {
    if (key) { localStorage.setItem("grootKey", key); history.replaceState(null, "", "/"); }
    else { key = localStorage.getItem("grootKey") || ""; }
  } catch (e) { /* private browsing: keep the key in memory only */ }

  const $ = (id) => document.getElementById(id);
  const canvas = $("buddy"), ctx = canvas.getContext("2d"), player = $("player");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const canListen = !!SR && window.isSecureContext;
  let data = null, mode = "idle", talking = false, recognizer = null, lastActive = performance.now();
  let anim = "idle", animStart = performance.now(), activityUntil = 0;
  let x = 0, targetX = null, faceRight = false, nextWalk = performance.now() + 6000;

  function setStatus(text, listening) {
    $("status").textContent = text;
    $("status").classList.toggle("listening", !!listening);
    $("mic").classList.toggle("on", !!listening);
  }

  function showMessage(html) { $("message").innerHTML = html; $("message").style.display = "flex"; }

  async function api(path, body) {
    const response = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: { "X-Groot-Key": key, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (response.status === 401) throw new Error("key");
    if (!response.ok) throw new Error("http " + response.status);
    return response.json();
  }

  // ---- drawing: replay the drawing commands recorded on the computer
  const images = {};  // sprite sheets used by the fox, downloaded once
  function loadImages() {
    const names = new Set();
    for (const frames of Object.values(data.anims))
      for (const ops of frames) for (const op of ops) if (op[0] === "I") names.add(op[1]);
    return Promise.all([...names].map((name) => new Promise((resolve) => {
      const img = new Image();
      img.onload = img.onerror = resolve;
      img.src = `/api/asset/${encodeURIComponent(name)}?k=${encodeURIComponent(key)}`;
      images[name] = img;
    })));
  }

  const paths = new Map();
  function path(d) {
    let p = paths.get(d);
    if (!p) { p = new Path2D(d); if (paths.size > 4000) paths.clear(); paths.set(d, p); }
    return p;
  }
  function drawOps(ops) {
    for (const op of ops) {
      switch (op[0]) {
        case "S": ctx.save(); break;
        case "R": ctx.restore(); break;
        case "T": ctx.translate(op[1], op[2]); break;
        case "O": ctx.rotate(op[1] * Math.PI / 180); break;
        case "K": ctx.scale(op[1], op[2]); break;
        case "C": ctx.clip(path(op[1])); break;
        case "F": ctx.fillStyle = op[5]; ctx.fillRect(op[1], op[2], op[3], op[4]); break;
        case "P": {
          const p = path(op[1]);
          if (op[2]) { ctx.fillStyle = op[2]; ctx.fill(p); }
          if (op[3]) { ctx.strokeStyle = op[3]; ctx.lineWidth = op[4]; ctx.stroke(p); }
          break;
        }
        case "G": {
          const p = path(op[1]);
          const g = ctx.createLinearGradient(op[2], op[3], op[4], op[5]);
          for (const [pos, color] of op[6]) g.addColorStop(pos, color);
          ctx.fillStyle = g; ctx.fill(p);
          if (op[7]) { ctx.strokeStyle = op[7]; ctx.lineWidth = op[8]; ctx.stroke(p); }
          break;
        }
        case "I": {  // one cell of a sprite sheet
          const img = images[op[1]];
          if (!img || !img.complete || !img.naturalWidth) break;
          const cw = img.naturalWidth / op[3], ch = img.naturalHeight / op[4];
          const alpha = ctx.globalAlpha;
          ctx.globalAlpha = alpha * op[9];
          ctx.drawImage(img, (op[2] % op[3]) * cw, Math.floor(op[2] / op[3]) * ch, cw, ch, op[5], op[6], op[7], op[8]);
          ctx.globalAlpha = alpha;
          break;
        }
        case "X":
          ctx.font = (op[6] ? "bold " : "") + Math.round(op[4] * 1.33) + "px -apple-system, Helvetica, sans-serif";
          ctx.textBaseline = "top"; ctx.fillStyle = op[5]; ctx.fillText(op[1], op[2], op[3]);
          break;
      }
    }
  }

  function layout() {
    const cssW = canvas.getBoundingClientRect().width;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssW * data.H / data.W * dpr);
    canvas.style.height = (cssW * data.H / data.W) + "px";
    if (targetX === null) x = (window.innerWidth - cssW) / 2;
  }

  function play(name) { if (anim !== name) { anim = name; animStart = performance.now(); } }

  // ---- the buddy's life: sit, wander, nap, and act out what it's asked
  function behave(now, dt) {
    const cssW = canvas.getBoundingClientRect().width;
    if (now < activityUntil) return;
    if (mode === "listening") return play("listening");
    if (mode === "thinking") return play("thinking");
    if (mode === "speaking") return play("speaking");
    if (targetX !== null) {
      const dx = targetX - x, speed = 70 * dt;
      if (Math.abs(dx) <= speed) { x = targetX; targetX = null; nextWalk = now + 8000 + Math.random() * 9000; }
      else { x += Math.sign(dx) * speed; faceRight = dx > 0; return play("walk"); }
    }
    if (now - lastActive > 90000) return play("sleep");
    if (now > nextWalk) {
      targetX = Math.max(8, Math.min(window.innerWidth - cssW - 8, Math.random() * (window.innerWidth - cssW)));
      if (Math.abs(targetX - x) < 30) { targetX = null; nextWalk = now + 5000; }
    }
    play("idle");
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    behave(now, dt);
    const frames = data.anims[anim];
    const every = (data.every && data.every[anim]) || 2;
    // (the frame's timestamp can be a little earlier than when this animation started)
    const index = Math.max(0, Math.floor((now - animStart) / 1000 * data.fps / every)) % frames.length;
    canvas.style.transform = `translateX(${x}px)` + (faceRight ? " scaleX(-1)" : "");
    const scale = canvas.width / data.W;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    try { drawOps(frames[index] || frames[0]); } catch (e) { console.warn(e); }
    requestAnimationFrame(frame);
  }

  // ---- talking
  function unlockAudio() {
    // phones only allow sound that starts from a tap, so warm the player up now
    player.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=";
    player.play().catch(() => {});
  }

  function stopTalking(message) {
    talking = false;
    if (recognizer) { try { recognizer.abort(); } catch (e) {} recognizer = null; }
    player.pause();
    if (window.speechSynthesis) speechSynthesis.cancel();
    mode = "idle"; lastActive = performance.now();
    setStatus(message || "Tap me to talk");
  }

  function listen(retries = 2) {
    if (!talking) return;
    if (!canListen) {
      mode = "idle"; talking = false;
      setStatus("Type, or use your keyboard's 🎤");
      $("text").focus();
      return;
    }
    recognizer = new SR();
    recognizer.lang = navigator.language || "en-US";
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
    let heard = false;
    recognizer.onresult = (e) => { heard = true; send(e.results[0][0].transcript, true); };
    recognizer.onerror = () => {};
    recognizer.onend = () => {
      recognizer = null;
      if (!heard && talking) {
        if (retries > 0) listen(retries - 1); else stopTalking();
      }
    };
    mode = "listening"; lastActive = performance.now();
    setStatus("Listening…", true);
    try { recognizer.start(); } catch (e) { stopTalking(); }
  }

  function speak(result, done) {
    mode = "speaking"; setStatus("Speaking…");
    if (result.audio) {
      player.src = `/api/audio/${result.audio}?k=${encodeURIComponent(key)}`;
      player.onended = done; player.onerror = done;
      player.play().catch(done);
    } else if (result.say && window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance(result.say);
      u.onend = done; u.onerror = done;
      speechSynthesis.speak(u);
    } else { done(); }
  }

  const ACTIVITY_SECONDS = { dance: 4, jump: 2, wave: 3, sleep: 6, football: 4, butterfly: 4, run: 3 };
  function act(activity) {
    if (!activity || activity === "stop") return;
    const name = { football: "dance", butterfly: "dance", run: "walk" }[activity] || activity;
    if (!data.anims[name]) return;
    play(name);
    activityUntil = performance.now() + (ACTIVITY_SECONDS[activity] || 3) * 1000;
  }

  async function send(text, fromVoice) {
    text = (text || "").trim();
    if (!text) return;
    lastActive = performance.now();
    $("bubble").style.display = "block";
    $("you").textContent = "You: " + text;
    $("reply").textContent = "…";
    mode = "thinking"; setStatus("Thinking…");
    let result;
    try { result = await api("/api/chat", { text }); }
    catch (e) {
      $("reply").textContent = e.message === "key" ? "This link's key isn't right. Open the link from your computer again."
                                                   : "I can't reach your computer. Is Groot still running there?";
      return stopTalking();
    }
    $("reply").textContent = result.reply;
    act(result.activity);
    speak(result, () => {
      if (result.end || !talking || !fromVoice) { stopTalking(); return; }
      listen();
    });
  }

  function toggleTalking() {
    unlockAudio();
    if (talking || mode !== "idle") return stopTalking();
    talking = true; lastActive = performance.now();
    listen();
  }

  canvas.addEventListener("click", toggleTalking);
  $("mic").addEventListener("click", toggleTalking);
  $("bar").addEventListener("submit", (e) => {
    e.preventDefault();
    unlockAudio();
    const text = $("text").value; $("text").value = ""; $("text").blur();
    talking = false;
    send(text, false);
  });

  async function start() {
    if (!key) {
      return showMessage("<div><p style='font-size:42px;margin:0'>🦊</p><p>Open the link (or scan the QR code) " +
                         "shown on your computer to connect to your Groot.</p></div>");
    }
    try { data = await api("/api/frames"); }
    catch (e) {
      return showMessage("<div><p style='font-size:42px;margin:0'>🦊</p><p>" + (e.message === "key"
        ? "This link's key isn't right. Open the link shown on your computer again."
        : "Can't reach Groot on your computer. Make sure it's running (python -m groot --phone) and try again.") +
        "</p></div>");
    }
    await loadImages();
    layout();
    window.addEventListener("resize", layout);
    if (!canListen) $("hint").textContent = window.isSecureContext
      ? "This browser can't listen — type, or use your keyboard's 🎤."
      : "On this link, use your keyboard's 🎤 to talk. Open the https link for tap-to-talk.";
    setStatus("Tap me to talk");
    requestAnimationFrame(frame);
  }
  start();
})();
</script>
</body>
</html>
